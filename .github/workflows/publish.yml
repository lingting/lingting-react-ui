name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Debug npm trusted publishing
        run: |
          set -e

          echo "===== Runtime ====="
          node --version
          npm --version
          pnpm --version

          echo ""
          echo "===== GitHub Actions ====="
          echo "GITHUB_WORKFLOW=${GITHUB_WORKFLOW}"
          echo "GITHUB_WORKFLOW_REF=${GITHUB_WORKFLOW_REF}"
          echo "GITHUB_WORKFLOW_SHA=${GITHUB_WORKFLOW_SHA}"
          echo "GITHUB_REPOSITORY=${GITHUB_REPOSITORY}"
          echo "GITHUB_REF=${GITHUB_REF}"
          echo "GITHUB_SHA=${GITHUB_SHA}"
          echo "GITHUB_EVENT_NAME=${GITHUB_EVENT_NAME}"

          echo ""
          echo "===== npm ====="
          npm config get registry
          npm config get userconfig
          npm config get @lingting:registry || true

          echo ""
          echo "===== Package ====="
          npm pkg get name
          npm pkg get version
          npm pkg get private
          npm pkg get publishConfig
          npm pkg get repository

          echo ""
          echo "===== npm whoami ====="
          npm whoami --registry=https://registry.npmjs.org/

          echo ""
          echo "===== npm config list (credentials redacted by npm) ====="
          npm config list

          echo ""
          echo "===== npm userconfig ====="
          if [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -E 's/(_authToken=).*/\1[REDACTED]/' "$NPM_CONFIG_USERCONFIG"
          else
            echo "NPM_CONFIG_USERCONFIG does not exist"
          fi

          echo ""
          echo "===== npm registry package ====="
          npm view lingting-react-ui name version dist-tags --registry=https://registry.npmjs.org/

          echo ""
          echo "===== npm package version ====="
          npm view "lingting-react-ui@$(npm pkg get version --raw)" version --registry=https://registry.npmjs.org/ || true
      - run: npm publish --registry=https://registry.npmjs.org/ --provenance --access public